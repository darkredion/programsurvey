<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>교육과정 만족도</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
html, body { height:100%; }
body {
  --paper:#E9EDF3; --card:#FFFFFF; --ink:#101B2D; --mute:#66748C; --line:#D6DCE7;
  --navy:#22355A; --navy-deep:#1B2C4B; --slate-soft:#EDF1F7; --slate-line:#CFD8E6; --slate-dim:#5C6B85;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
  min-height:100vh; padding:30px 30px; line-height:1.5; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; justify-content:flex-start;
}
.wrap { max-width:1200px; margin:0 auto; width:100%; flex:1; display:flex; flex-direction:column; }
.top { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:26px; }
.brand h1 { margin:0; font-size:22px; font-weight:800; letter-spacing:-0.03em; }
.brand p { margin:4px 0 0; font-size:12.5px; color:var(--mute); }
.topright { display:flex; align-items:center; gap:10px; }
.who { font-size:11.5px; color:var(--mute); }
.tabs { display:flex; gap:4px; background:#DDE3EC; padding:3px; border-radius:9px; }
.tabs button { border:0; background:transparent; font-family:inherit; font-size:12.5px; font-weight:700; color:var(--mute); padding:7px 14px; border-radius:7px; cursor:pointer; }
.tabs button[data-on="1"] { background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(16,27,45,.12); }

.rail { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px 16px; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; align-items:end; }
.pick { min-width:0; }
.pick .lbl { font-size:11px; font-weight:700; color:var(--mute); letter-spacing:.04em; margin-bottom:6px; }
.pick .box { position:relative; }
.pick .box:after { content:""; position:absolute; right:12px; top:50%; width:7px; height:7px; margin-top:-5px; border-right:1.6px solid var(--mute); border-bottom:1.6px solid var(--mute); transform:rotate(45deg); pointer-events:none; }
.pick select { -webkit-appearance:none; appearance:none; width:100%; font-family:inherit; font-size:13.5px; font-weight:600; color:var(--ink); background:#F7F9FC; border:1px solid var(--line); border-radius:9px; padding:10px 30px 10px 12px; cursor:pointer; text-overflow:ellipsis; }
.pick select:hover { border-color:#AEBACD; }
.pick[data-set="1"] select { background:#fff; border-color:#AEBACD; }
select:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--navy); outline-offset:2px; }

.result { margin-top:26px; flex:1; display:flex; flex-direction:column; }
.rhead { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.rhead h2 { margin:0; font-size:19px; font-weight:800; letter-spacing:-0.03em; }
.rhead .meta { font-size:12.5px; color:var(--mute); }
.rhead .meta b { font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.metric { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 20px 18px; display:flex; flex-direction:column; justify-content:center; }
.metric .k { font-size:12px; font-weight:700; color:var(--mute); }
.metric .v { font-size:34px; font-weight:600; letter-spacing:-0.04em; margin:6px 0 2px; font-variant-numeric:tabular-nums; }
.metric .v span { font-size:14px; color:var(--mute); margin-left:3px; letter-spacing:0; }
.meter { display:flex; gap:3px; margin:10px 0 9px; }
.meter i { flex:1; height:7px; background:#E7EBF1; border-radius:2px; overflow:hidden; display:block; }
.meter i b { display:block; height:100%; background:var(--navy); border-radius:2px; }
.dist { font-size:12.5px; color:var(--mute); display:flex; gap:11px; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
.dist s { text-decoration:none; }
.dist s b { color:var(--ink); font-weight:600; }

.improve { width:100%; text-align:left; margin-top:30px; flex:1; min-height:0; background:var(--slate-soft); border:1px solid var(--slate-line); border-left:3px solid var(--navy); border-radius:12px; padding:18px 20px 20px; font-family:inherit; color:var(--ink); cursor:pointer; display:block; }
.improve:hover { background:#E6ECF5; }
.improve .k { font-size:12px; font-weight:700; color:var(--navy-deep); display:flex; justify-content:space-between; align-items:center; gap:8px; }
.improve .k em { font-style:normal; font-weight:600; color:var(--slate-dim); font-size:11.5px; }
.improve ol { margin:11px 0 0; padding:0; list-style:none; counter-reset:p; }
.improve li { counter-increment:p; padding:8px 0 8px 26px; position:relative; border-top:1px solid #DEE5EF; font-size:13.5px; }
.improve li:first-child { border-top:0; padding-top:2px; }
.improve li:before { content:counter(p); position:absolute; left:0; top:9px; font-size:11.5px; color:var(--navy); font-weight:700; font-variant-numeric:tabular-nums; }
.improve li:first-child:before { top:3px; }
.improve li b { font-weight:700; }
.improve li span { color:var(--slate-dim); }
.improve li u { text-decoration:none; font-size:11.5px; color:var(--slate-dim); margin-left:5px; font-variant-numeric:tabular-nums; }
.improve .edit { margin-top:12px; display:flex; gap:8px; }
.improve textarea { width:100%; font-family:inherit; font-size:13px; border:1px solid var(--slate-line); border-radius:8px; padding:9px 10px; resize:vertical; min-height:74px; background:#fff; color:var(--ink); }

.backdrop { position:fixed; inset:0; background:rgba(16,27,45,.42); display:flex; align-items:center; justify-content:center; padding:18px; z-index:60; }
.modal { background:#fff; border-radius:14px; width:100%; max-width:600px; max-height:82vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 18px 50px rgba(16,27,45,.3); }
.modal header { padding:16px 18px 13px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.modal header h3 { margin:0; font-size:16px; font-weight:800; }
.modal header p { margin:3px 0 0; font-size:12px; color:var(--mute); }
.modal .x { border:0; background:#EEF1F6; width:28px; height:28px; border-radius:8px; cursor:pointer; font-size:15px; color:var(--mute); font-family:inherit; }
.modal .bar { padding:10px 18px; border-bottom:1px solid #EEF1F6; display:flex; gap:8px; align-items:center; font-size:12px; color:var(--mute); }
.modal .bar button { font-family:inherit; font-size:12px; font-weight:600; border:1px solid var(--line); background:#F7F9FC; color:var(--ink); border-radius:7px; padding:5px 10px; cursor:pointer; }
.modal .bar button[data-on="1"] { background:var(--navy); border-color:var(--navy); color:#fff; }
.modal ul { margin:0; padding:6px 18px 18px; list-style:none; overflow:auto; }
.modal li { display:grid; grid-template-columns:26px 1fr; gap:8px; padding:10px 0; border-bottom:1px solid #EEF1F6; font-size:13.5px; white-space:pre-wrap; word-break:break-word; }
.modal li i { font-style:normal; font-size:11.5px; color:#9AA6B8; padding-top:2px; font-variant-numeric:tabular-nums; }
.modal li[data-dim="1"] { color:#98A3B4; }

.panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
.panel h3 { margin:0 0 3px; font-size:15px; font-weight:800; }
.panel .sub { font-size:12.5px; color:var(--mute); margin:0 0 15px; }
.drop { border:1.5px dashed #B9C4D4; border-radius:10px; padding:22px; text-align:center; background:#F7F9FC; }
.drop p { margin:0 0 10px; font-size:13px; color:var(--mute); }
.btn { font-family:inherit; font-size:13px; font-weight:700; border-radius:9px; padding:9px 16px; cursor:pointer; border:1px solid var(--navy); background:var(--navy); color:#fff; }
.btn.ghost { background:#fff; color:var(--ink); border-color:var(--line); }
.btn.small { font-size:12px; padding:7px 12px; }
.btn[disabled] { opacity:.45; cursor:default; }
.fields { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:15px; }
.fields.two { grid-template-columns:1fr 1fr; max-width:520px; }
.field label { display:block; font-size:11px; font-weight:700; color:var(--mute); margin-bottom:5px; }
.field input { width:100%; font-family:inherit; font-size:13.5px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
.note { font-size:12.5px; margin-top:12px; padding:10px 12px; border-radius:8px; }
.note.ok { background:#E1EAF6; color:var(--navy-deep); }
.note.err { background:#FBECE8; color:#8F3520; }
.note.warn { background:#FAF3E3; color:#7A5B12; }
.bannerbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12.5px; padding:10px 14px; border-radius:10px; margin-bottom:14px; background:var(--slate-soft); border:1px solid var(--slate-line); color:var(--slate-dim); }
.bannerbar b { color:var(--ink); font-weight:700; }
.bannerbar.bad { background:#FBECE8; border-color:#EDD3CB; color:#8F3520; }
table { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
th { text-align:left; font-size:11px; color:var(--mute); font-weight:700; padding:8px; border-bottom:1px solid var(--line); }
td { padding:9px 8px; border-bottom:1px solid #EEF1F6; }
td.num { font-variant-numeric:tabular-nums; color:var(--mute); font-size:12.5px; }
td button { font-family:inherit; font-size:11.5px; border:1px solid var(--line); background:#fff; color:#A03A26; border-radius:6px; padding:4px 9px; cursor:pointer; }
.empty { text-align:center; padding:44px 20px; color:var(--mute); font-size:13.5px; }
.empty b { display:block; color:var(--ink); font-size:15px; font-weight:800; margin-bottom:6px; }
code { background:#EEF1F6; padding:1px 5px; border-radius:4px; font-size:12px; }
@media (max-width:720px) {
  body { padding:20px 14px 24px; }
  .grid { grid-template-columns:1fr; }
  .fields { grid-template-columns:1fr 1fr; }
  .rail { grid-template-columns:repeat(2,1fr); gap:9px; }
  .metric .v { font-size:30px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>교육과정 만족도</h1>
      <p>설문 원본을 등록하고 연도 · 강사 · 과정 · 차수 순으로 결과를 확인합니다.</p>
    </div>
    <div class="topright">
      <span class="who" id="who"></span>
      <div class="tabs">
        <button id="tab-view" data-on="1">만족도 보기</button>
        <button id="tab-manage">자료 등록</button>
      </div>
    </div>
  </div>
  <div id="banner"></div>
  <div id="main" style="flex:1; display:flex; flex-direction:column;"></div>
</div>
<div id="modal-root"></div>

<script>
"use strict";

/* =====================================================================
   ▼▼▼ 여기 두 줄만 본인 Supabase 프로젝트 값으로 바꾸세요 ▼▼▼
   Supabase 대시보드 → Project Settings → API 에서 확인합니다.
   anon key는 공개용 키라 브라우저에 넣어도 됩니다. service_role 키는 절대 넣지 마세요.
   ===================================================================== */
var SUPABASE_URL = "https://qhvqosjnkxecwtdhinif.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFodnFvc2pua3hlY3d0ZGhpbmlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NjgzODgsImV4cCI6MjEwMzE0NDM4OH0.ttx6nrORDQVaoXWJD7csRl8VUZGkYleGDf9oAuT8Sxc";
/* ===================================================================== */

var sb = null, connError = "";
var datasets = [], edits = {}, session = null;
var loading = true;

function initClient() {
  var url = SUPABASE_URL, key = SUPABASE_ANON_KEY;
  try {
    var saved = JSON.parse(localStorage.getItem("survey-sb-config") || "null");
    if (saved && !url) { url = saved.url; key = saved.key; }
  } catch (e) {}
  if (!url || !key) { connError = "setup"; return; }
  if (!window.supabase) { connError = "라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."; return; }
  sb = window.supabase.createClient(url, key);
}

/* ============================ 서버 통신 ============================ */
async function loadAll() {
  if (!sb) return;
  loading = true; render();
  try {
    var a = await sb.from("survey_datasets").select("*").order("year", { ascending: false });
    if (a.error) throw a.error;
    datasets = (a.data || []).map(function (r) {
      return { id: r.id, year: r.year, instructor: r.instructor, course: r.course, round: r.round, fileName: r.file_name, responses: r.responses || [] };
    });
    var b = await sb.from("survey_edits").select("*");
    if (b.error) throw b.error;
    edits = {};
    (b.data || []).forEach(function (r) { edits[r.key] = r.points; });
    connError = "";
  } catch (e) {
    connError = e.message || "데이터를 불러오지 못했습니다.";
  }
  loading = false; render();
}
function subscribeRealtime() {
  if (!sb) return;
  sb.channel("survey-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "survey_datasets" }, loadAll)
    .on("postgres_changes", { event: "*", schema: "public", table: "survey_edits" }, loadAll)
    .subscribe();
}

/* ============================ 엑셀 파싱 ============================ */
function norm(v) { return (v == null ? "" : String(v)).replace(/\s+/g, ""); }
function asText(v) { return (v == null ? "" : String(v)).trim(); }
function asNum(v) {
  if (typeof v === "number" && isFinite(v)) return v;
  if (typeof v === "string" && /^\s*-?\d+(\.\d+)?\s*$/.test(v)) return parseFloat(v);
  return null;
}
function yearOf(v) {
  if (v instanceof Date && !isNaN(v)) return v.getFullYear();
  var m = String(v || "").match(/(20\d{2})/);
  return m ? parseInt(m[1], 10) : null;
}
function locateSheet(rows) {
  for (var i = 0; i < Math.min(rows.length, 40); i++) {
    var cells = (rows[i] || []).map(norm);
    var cOverall = -1, cRec = -1, cDel = -1, cFree = -1, cValid = -1, cStart = -1;
    cells.forEach(function (c, idx) {
      if (cOverall < 0 && c.indexOf("전반") >= 0) cOverall = idx;
      if (cRec < 0 && c.indexOf("추천") >= 0) cRec = idx;
      if (cDel < 0 && (c.indexOf("강의능력") >= 0 || c.indexOf("전달력") >= 0)) cDel = idx;
      if (cFree < 0 && (c.indexOf("보완") >= 0 || c.indexOf("제안") >= 0)) cFree = idx;
      if (cValid < 0 && c.indexOf("적격") >= 0) cValid = idx;
      if (cStart < 0 && (c.indexOf("시작일시") >= 0 || c.indexOf("응답일") >= 0 || c.indexOf("종료일시") >= 0)) cStart = idx;
    });
    if (cOverall < 0 || cRec < 0) continue;
    var data = [];
    for (var j = i + 1; j < rows.length; j++) {
      var row = rows[j] || [];
      if (cValid >= 0 && norm(row[cValid]).indexOf("부적격") >= 0) continue;
      var o = asNum(row[cOverall]), rc = asNum(row[cRec]);
      var d = cDel >= 0 ? asNum(row[cDel]) : null;
      var t = cFree >= 0 ? asText(row[cFree]) : "";
      if (o == null && rc == null && d == null && !t) continue;
      data.push({ o: o, r: rc, d: d, t: t, y: cStart >= 0 ? yearOf(row[cStart]) : null });
    }
    if (data.length) return { data: data, hasDelivery: cDel >= 0 };
  }
  return null;
}
function parseWorkbook(buffer) {
  var wb = XLSX.read(buffer, { type: "array", cellDates: true });
  var best = null;
  wb.SheetNames.forEach(function (name) {
    var rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null, blankrows: false });
    var f = locateSheet(rows);
    if (f && (!best || f.data.length > best.data.length)) best = f;
  });
  if (!best) throw new Error("설문 문항을 찾지 못했습니다. '교육과정 전반', '추천', '강의능력' 문항이 있는 응답 파일인지 확인해 주세요.");
  var tally = {};
  best.data.forEach(function (d) { if (d.y) tally[d.y] = (tally[d.y] || 0) + 1; });
  var ys = Object.keys(tally).sort(function (a, b) { return tally[b] - tally[a]; });
  return {
    responses: best.data.map(function (d) { return { o: d.o, r: d.r, d: d.d, t: d.t }; }),
    yearGuess: ys.length ? parseInt(ys[0], 10) : new Date().getFullYear(),
    hasDelivery: best.hasDelivery
  };
}

/* ============================ 계산 ============================ */
function stat(rows, key) {
  var vals = rows.map(function (r) { return r[key]; }).filter(function (v) { return typeof v === "number" && isFinite(v); });
  if (!vals.length) return null;
  var sum = vals.reduce(function (a, b) { return a + b; }, 0);
  return { avg: sum / vals.length, n: vals.length,
    dist: [1, 2, 3, 4, 5].map(function (s) { return vals.filter(function (v) { return Math.round(v) === s; }).length; }) };
}
var TRIVIAL = ["없음","없습니다","없어요","무","특별히없음","해당없음","na","x","-",".","..","…","좋음","좋아요","감사합니다","감사해요"];
function isSubstantive(t) { var n = norm(t).toLowerCase(); return n.length > 3 && TRIVIAL.indexOf(n) < 0; }
function roundSort(a, b) {
  var na = parseFloat(String(a).replace(/[^\d.]/g, "")), nb = parseFloat(String(b).replace(/[^\d.]/g, ""));
  if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
  return String(a).localeCompare(String(b), "ko");
}
var RULES = [
  { title: "자료 사전 배포", detail: "강의 자료의 사전 배포 요청", re: /자료|피피티|ppt|발표자료|교재|파일|공유|배포/i },
  { title: "실전 분석 보강", detail: "동종업계 기업 간 재무상태 비교 등 실전 분석 내용이 부족", re: /실전|사례|구체|심화|깊이|종목|주식|실무|적용|디테일|분석|예시/i },
  { title: "질의응답 시간", detail: "질의응답 시간이 없어 궁금증 해소가 어려웠다는 의견", re: /질문|질의|q&a|qa|답변|문답/i },
  { title: "강의 시간 확대", detail: "강의 시간이 짧아 내용 소화에 시간 부족", re: /시간이짧|시간짧|시간부족|짧|더길게|시간이더|길게/i },
  { title: "전달 속도 조절", detail: "강의 진행 속도가 빨라 내용 이해에 어려움", re: /말이빠|속도|빠름|빨라|발음|목소리|천천히/i },
  { title: "정기 개설", detail: "동일 강의의 정기적 개설 요망", re: /매년|정기|연1회|년1회|또듣|또모|자주|다음에도|하반기|재개설|다시/i },
  { title: "자사 맞춤 심화", detail: "자사 상황에 맞춘 구체적 논의 필요", re: /우리회사|자사|맞춤|컨텍스트|핀포인트|일반적|회사에/i },
  { title: "강의 환경 개선", detail: "강의장 음향 및 좌석 등 환경 개선 건의", re: /자리|음향|마이크|화면|장소|온라인|중계|소리|덥|춥/i }
];
function ruleSummary(texts) {
  var pool = texts.filter(isSubstantive);
  if (!pool.length) return [];
  var hits = RULES.map(function (r) {
    return { title: r.title, detail: r.detail, count: pool.filter(function (t) { return r.re.test(norm(t)); }).length };
  }).filter(function (h) { return h.count > 0; });
  hits.sort(function (a, b) { return b.count - a.count; });
  var out = hits.slice(0, 3);
  if (out.length < 3) out.push({ title: "기타 개별 의견", detail: "분류되지 않은 개별 의견은 원문 확인 필요", count: pool.length });
  return out.slice(0, 3);
}

/* ============================ 상태 ============================ */
var tab = "view", sel = { year: null, instructor: null, course: null, round: null };
var pending = null, msg = null, editing = false, onlyReal = false, busy = false;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function uniq(a) { var s = []; a.forEach(function (v) { if (s.indexOf(v) < 0) s.push(v); }); return s; }
function years() { return uniq(datasets.map(function (d) { return d.year; })).sort(function (a, b) { return b - a; }); }
function instructors() { return uniq(datasets.filter(function (d) { return d.year === sel.year; }).map(function (d) { return d.instructor; })).sort(function (a, b) { return a.localeCompare(b, "ko"); }); }
function courses() { return uniq(datasets.filter(function (d) { return d.year === sel.year && d.instructor === sel.instructor; }).map(function (d) { return d.course; })).sort(function (a, b) { return a.localeCompare(b, "ko"); }); }
function rounds() { return uniq(datasets.filter(function (d) { return d.year === sel.year && d.instructor === sel.instructor && d.course === sel.course; }).map(function (d) { return d.round; })).sort(roundSort); }
function autoSelect() {
  var g = 0;
  while (g++ < 8) {
    var y = years(), i = instructors(), c = courses(), r = rounds();
    if (!sel.year && y.length === 1) { sel.year = y[0]; continue; }
    if (sel.year && !sel.instructor && i.length === 1) { sel.instructor = i[0]; continue; }
    if (sel.instructor && !sel.course && c.length === 1) { sel.course = c[0]; continue; }
    if (sel.course && !sel.round && r.length === 1) { sel.round = r[0]; continue; }
    break;
  }
}
function picked() {
  if (!sel.year || !sel.instructor || !sel.course || !sel.round) return null;
  var items = datasets.filter(function (d) {
    return d.year === sel.year && d.instructor === sel.instructor && d.course === sel.course &&
      (sel.round === "__ALL__" || d.round === sel.round);
  });
  if (!items.length) return null;
  var responses = [];
  items.forEach(function (d) { responses = responses.concat(d.responses); });
  return { items: items, responses: responses,
    overall: stat(responses, "o"), recommend: stat(responses, "r"), delivery: stat(responses, "d"),
    comments: responses.map(function (r) { return r.t; }).filter(function (t) { return t && t.trim(); }) };
}
function sig() { return sel.year + "|" + sel.instructor + "|" + sel.course + "|" + sel.round; }
function canEdit() { return !!session; }

/* ============================ 렌더 ============================ */

function meterHtml(v) {
  var out = "";
  for (var i = 0; i < 5; i++) out += '<i><b style="width:' + (Math.max(0, Math.min(1, v - i)) * 100) + '%"></b></i>';
  return '<div class="meter">' + out + "</div>";
}
function metricHtml(label, s) {
  var dist = "";
  if (s) [5, 4, 3, 2, 1].forEach(function (p) { if (s.dist[p - 1]) dist += "<s>" + p + "점 <b>" + s.dist[p - 1] + "</b></s>"; });
  else dist = "<s>응답 없음</s>";
  return '<div class="metric"><div class="k">' + label + '</div><div class="v">' + (s ? s.avg.toFixed(2) : "–") +
    '<span>/ 5</span></div>' + meterHtml(s ? s.avg : 0) + '<div class="dist">' + dist + "</div></div>";
}

    var list = points.length ? points.map(function (pt) {

    }).join("") : "<li><span>개선 제안에 해당하는 응답 없음</span></li>";

    var editor = "";
    if (canEdit()) {
      editor = editing
        ? '<div class="edit" onclick="event.stopPropagation()"><textarea id="edit-box">' +

      '<div class="grid">' + metricHtml("과정 전반", p.overall) + metricHtml("추천 여부", p.recommend) + metricHtml("강의 전달력", p.delivery) + "</div>" +
      '<div class="improve" id="improve" role="button" tabindex="0"><div class="k"><span>개선점 요약' +
      (edited ? " (직접 수정함)" : "") + '</span><em>주관식 ' + p.comments.length + "건 · 눌러서 전체 보기 →</em></div><ol>" +
      list + "</ol>" + editor + "</div></div>";
  }
  main.innerHTML = '<div class="rail">' + rail + "</div>" + body;

  Array.prototype.forEach.call(main.querySelectorAll("select[data-key]"), function (el) {
    el.addEventListener("change", function () {
      var key = el.getAttribute("data-key"), v = el.value;
      sel[key] = key === "year" ? (v ? parseInt(v, 10) : null) : (v || null);
      if (key === "year") { sel.instructor = null; sel.course = null; sel.round = null; }
      if (key === "instructor") { sel.course = null; sel.round = null; }
      if (key === "course") sel.round = null;
      editing = false; render();
    });
  });
  var imp = document.getElementById("improve");
  if (imp) {
    imp.addEventListener("click", openModal);
    imp.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openModal(); } });
  }
  var o = document.getElementById("edit-open");
  if (o) o.addEventListener("click", function (e) { e.stopPropagation(); editing = true; render(); });
  var s2 = document.getElementById("edit-save");
  if (s2) s2.addEventListener("click", async function (e) {
    e.stopPropagation();
    var lines = document.getElementById("edit-box").value.split("\n").map(function (t) { return t.trim(); }).filter(Boolean).slice(0, 3);
    var res = await sb.from("survey_edits").upsert({ key: sig(), points: lines });
    if (res.error) { alert("저장 실패: " + res.error.message); return; }
    edits[sig()] = lines; editing = false; render();
  });
  var c2 = document.getElementById("edit-cancel");
  if (c2) c2.addEventListener("click", function (e) { e.stopPropagation(); editing = false; render(); });
  var r2 = document.getElementById("edit-reset");
  if (r2) r2.addEventListener("click", async function (e) {
    e.stopPropagation();
    var res = await sb.from("survey_edits").delete().eq("key", sig());
    if (res.error) { alert("삭제 실패: " + res.error.message); return; }
    delete edits[sig()]; editing = false; render();
  });
}

    (list.length ? list.map(function (t, i) {

window.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

    '</p><input type="file" id="file" accept=".xlsx,.xls" style="display:none">' +
    '<button class="btn ghost" id="pick-file">파일 선택</button></div>' + form +

    (datasets.length ? "<table><thead><tr><th>연도</th><th>강사</th><th>과정</th><th>차수</th><th>응답</th><th></th></tr></thead><tbody>" +
      rowsHtml + "</tbody></table>" : '<p class="sub" style="margin:8px 0 0">아직 등록된 자료가 없습니다.</p>') + "</div>";

async function login() {
  var email = document.getElementById("l-email").value.trim();
  var pw = document.getElementById("l-pw").value;
  if (!email || !pw) { msg = { type: "err", text: "이메일과 비밀번호를 입력해 주세요." }; return render(); }
  busy = true; msg = null; render();
  var res = await sb.auth.signInWithPassword({ email: email, password: pw });
  busy = false;
  if (res.error) { msg = { type: "err", text: "로그인 실패: " + res.error.message }; return render(); }
  session = res.data.session; msg = null; render();
}

async function saveDataset() {
  var year = parseInt(document.getElementById("f-year").value, 10);
  var instructor = document.getElementById("f-instructor").value.trim();
  var course = document.getElementById("f-course").value.trim();
  var round = document.getElementById("f-round").value.trim() || "1차";
  if (!year || year < 2000 || year > 2100) { msg = { type: "err", text: "연도를 네 자리로 입력해 주세요." }; return render(); }
  if (!instructor) { msg = { type: "err", text: "강사명을 입력해 주세요." }; return render(); }
  if (!course) { msg = { type: "err", text: "과정명을 입력해 주세요." }; return render(); }
  busy = true; render();
  var res = await sb.from("survey_datasets").insert({
    year: year, instructor: instructor, course: course, round: round,
    file_name: pending.fileName, responses: pending.responses
  });
  busy = false;
  if (res.error) { msg = { type: "err", text: "등록 실패: " + res.error.message }; return render(); }
  msg = { type: "ok", text: course + " · " + round + " (응답 " + pending.responses.length + "건) 등록 완료. 모든 사용자에게 반영됩니다." };
  pending = null;
  await loadAll();
}

function bindSetup() {
  var s = document.getElementById("s-save");
  if (!s) return;
  s.addEventListener("click", function () {
    var url = document.getElementById("s-url").value.trim();
    var key = document.getElementById("s-key").value.trim();
    if (!url || !key) return;
    localStorage.setItem("survey-sb-config", JSON.stringify({ url: url, key: key }));
    location.reload();
  });
}

function render() {
  renderBanner();
  renderWho();
  document.getElementById("tab-view").setAttribute("data-on", tab === "view" ? "1" : "0");
  document.getElementById("tab-manage").setAttribute("data-on", tab === "manage" ? "1" : "0");
  document.getElementById("tab-manage").textContent = (canEdit() ? "자료 등록" : "자료 등록") + (datasets.length ? " (" + datasets.length + ")" : "");
  if (tab === "view") renderView(); else renderManage();
}
document.getElementById("tab-view").addEventListener("click", function () { tab = "view"; msg = null; render(); });
document.getElementById("tab-manage").addEventListener("click", function () { tab = "manage"; msg = null; render(); });

(async function start() {
  initClient();
  render();
  if (!sb) return;
  var s = await sb.auth.getSession();
  session = s.data.session;
  sb.auth.onAuthStateChange(function (_e, ns) { session = ns; render(); });
  await loadAll();
  subscribeRealtime();
  if (!datasets.length && canEdit()) { tab = "manage"; render(); }
})();
</script>
